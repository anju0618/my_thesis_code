[project]
name = "analysis"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fugashi>=1.5.2",
    "google-api-python-client>=2.198.0",
    "japanize-matplotlib>=1.1.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "ollama>=0.6.2",
    "oseti>=0.4.3.1",
    "pandas>=3.0.5",
    "pymlask>=0.3.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.7.0",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "unidic-lite>=1.0.8",
]

# GPU（CUDA）版PyTorchを使うための設定。PyPI標準のtorchホイールはWindowsでは
# CPU専用ビルドのみで、GPU版はPyTorch公式のインデックス（download.pytorch.org）
# からのみ配布されている。ドライバがサポートするCUDAバージョン（nvidia-smiで確認、
# 本機では13.0）以下のビルド（cu126）を明示的に指定する。
# GPUのないマシン（Linux/macOS含む）では従来通りPyPI標準のCPUビルドを使う。
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "platform_system == 'Windows'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
